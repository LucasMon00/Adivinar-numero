<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Adivina el número</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Adivina el número</h1>

    <p>Hemos elegido un número entre el 1 y el 100. Tienes 10 intentos. Te diremos si el número es más pequeño o más grande.</p>

    <div class="form">
      <label for="guessField">Introduce un número: </label>
      <input type="number" min="1" max="100" required id="guessField" class="guessField" />
      <input type="submit" value="Enviar intento" class="guessSubmit" />
    </div>

    <div class="resultParas">
      <p class="guesses"></p>
      <p class="lastResult"></p>
      <p class="lowOrHi"></p>
      <p class="attemptCounter">Intento: 1 de 10</p>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
